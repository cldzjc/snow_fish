name: snow_fish
description: "skneo · sk社区，面向滑雪人群的 UGC 内容社区。"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Database
  supabase_flutter: ^2.5.2
  supabase: ^2.2.0

  # Data Models
  equatable: ^2.0.5

  # UI & Utils
  flutter_staggered_grid_view: ^0.7.0
  cached_network_image: ^3.3.0
  google_fonts: ^6.1.0
  photo_view: ^0.14.0

  # File upload / media
  file_picker: ^10.3.8
  video_player: ^2.5.1
  http: ^1.6.0
  dio: ^5.4.0
  image: ^4.0.17
  mime: ^1.0.2
  path: ^1.8.3
  video_thumbnail: ^0.5.0
  share_plus: ^12.0.2
  lottie: ^3.3.3
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/data/
