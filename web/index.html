<!DOCTYPE html>
<html>
<head>
  <!--

    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="snow_fish">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>snow_fish</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="skneo-turnstile-container"></div>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script>
    (() => {
      const siteKey = '0x4AAAAAAF6-Q66h3AkTWr-G';
      let widgetId;
      let callback;
      let executeWhenReady = false;

      window.skneoTurnstileRender = (tokenCallback) => {
        callback = tokenCallback;
        const render = () => {
          if (widgetId !== undefined) return;
          if (!window.turnstile) {
            window.setTimeout(render, 100);
            return;
          }
          widgetId = window.turnstile.render('#skneo-turnstile-container', {
            sitekey: siteKey,
            size: 'invisible',
            execution: 'execute',
            callback: (token) => callback?.(token),
            'expired-callback': () => callback?.(''),
            'error-callback': () => callback?.('')
          });
          if (executeWhenReady) {
            executeWhenReady = false;
            window.turnstile.execute(widgetId);
          }
        };
        render();
      };
      window.skneoTurnstileExecute = () => {
        if (widgetId !== undefined && window.turnstile) {
          window.turnstile.execute(widgetId);
        } else {
          executeWhenReady = true;
        }
      };
      window.skneoTurnstileReset = () => {
        executeWhenReady = false;
        if (widgetId !== undefined && window.turnstile) {
          window.turnstile.reset(widgetId);
        }
        callback = undefined;
      };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
